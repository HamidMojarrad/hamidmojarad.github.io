<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Site control panel</title>
<style>
:root{--ink:#17202b;--soft:#566170;--bg:#f4f6f9;--card:#fff;--line:#d5dce5;--navy:#1d3980;--bad:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
header{background:var(--navy);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0}main{max-width:820px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}
input[type=text],input[type=password],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
textarea{min-height:84px;resize:vertical}
button{font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
button.alt{background:#fff;color:var(--navy)}button.del{border-color:var(--bad);color:var(--bad);background:#fff}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #0e8a8c;outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#fff;color:var(--navy)}.tabs button.on{background:var(--navy);color:#fff}
.item>summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.tools{display:flex;gap:6px;margin-top:12px}.file{display:flex;gap:8px;align-items:center}.file input[type=text]{flex:1}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;max-width:90vw;display:none}
#msg.err{background:var(--bad)}.hint{color:var(--soft);font-size:13px}
</style>
</head>
<body>
<header><h1>Site control panel</h1><div id="bar" hidden>
<button class="alt" id="dl">Download JSON</button> <button id="save">Save &amp; publish</button></div></header>
<main>
<div id="login" class="card">
<p>Sign in with a GitHub token to edit your site. Create a <b>fine-grained token</b> at GitHub → Settings → Developer settings, limited to this one repository with <b>Contents: Read and write</b>. The token stays in this browser tab only.</p>
<label>Repository</label><input type="text" id="repo" value="HamidMojarrad/hamidmojarad.github.io">
<label>Branch</label><input type="text" id="branch" value="main">
<label>Token</label><input type="password" id="token" autocomplete="off">
<p><button id="go">Connect</button></p>
</div>
<div id="app" hidden><div class="tabs" id="tabs"></div><div id="form"></div></div>
</main>
<div id="msg" role="status"></div>
<script>
const S={
profile:{t:'Profile',o:1,f:{name:['t','Name'],role:['t','Role'],tagline:['a','Tagline'],photo:['f','Photo'],cv:['f','CV (PDF)'],bio:['p','About (blank line between paragraphs)']}},
links:{t:'Links',f:{label:['t','Label'],url:['t','URL']},k:'label'},

research:{t:'Research',f:{title:['t','Title'],text:['a','Text']},k:'title'},
publications:{t:'Publications',top:1,f:{title:['t','Title'],venue:['t','Venue'],year:['t','Year'],text:['a','Description'],pdf:['f','PDF'],link:['t','Publisher link (optional)'],featured:['c','Feature this paper']},k:'title'},
awards:{t:'Awards',f:{title:['t','Title'],org:['t','Organization'],date:['t','Date'],text:['a','Text']},k:'title'},
labs:{t:'Labs',f:{title:['t','Name'],url:['t','Website'],text:['a','Text']},k:'title'},
contact:{t:'Contact',o:1,f:{email:['t','Email'],address:['n','Address (one line per row)'],map:['t','Map link'],mapEmbed:['t','Map embed URL (Google Maps → Share → Embed a map → copy the src="..." value)']}}};
let cfg,data,sha,tab='profile',pending={},dirty=false;
const $=id=>document.getElementById(id);
const el=(t,a={},...c)=>{const e=document.createElement(t);Object.assign(e,a);e.append(...c.filter(x=>x!=null));return e};
function say(m,err){const b=$('msg');b.textContent=m;b.className=err?'err':'';b.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>b.style.display='none',err?7000:3000)}
const enc=s=>btoa(unescape(encodeURIComponent(s))),dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function gh(path,opt={}){const r=await fetch('https://api.github.com/repos/'+cfg.repo+'/contents/'+path+(opt.method?'':'?ref='+cfg.branch),{...opt,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error(r.status===401?'Token rejected (401).':r.status===404?'Not found (404). Check repository, branch and token access.':r.status+' '+(await r.text()).slice(0,160));return r.json()}
$('go').onclick=async()=>{cfg={repo:$('repo').value.trim(),branch:$('branch').value.trim(),token:$('token').value.trim()};
try{const f=await gh('data/content.json');sha=f.sha;data=JSON.parse(dec(f.content));sessionStorage.cfg=JSON.stringify(cfg);start()}catch(e){say(e.message,1)}};
function start(){$('login').hidden=true;$('app').hidden=false;$('bar').hidden=false;
$('tabs').replaceChildren(...Object.keys(S).map(k=>el('button',{textContent:S[k].t,id:'t-'+k,onclick:()=>{tab=k;draw()}})));draw()}
function field(o,k,[type,label]){const w=el('div');
if(type==='c'){const c=el('input',{type:'checkbox',checked:!!o[k],onchange:e=>{o[k]=e.target.checked;dirty=true}});w.append(el('label',{},c,' '+label));return w}
w.append(el('label',{textContent:label}));
if(type==='t'||type==='f'){const i=el('input',{type:'text',value:o[k]||'',oninput:e=>{o[k]=e.target.value;dirty=true}});
if(type==='f'){const f=el('input',{type:'file',onchange:async e=>{const file=e.target.files[0];if(!file)return;const b=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(file)});
const path='files/'+file.name.replace(/[^\w.\-]+/g,'_');pending[path]=b;o[k]=path;i.value=path;dirty=true;say('Will upload '+path+' when you save.')}});w.append(el('div',{className:'file'},i,f))}else w.append(i)}
else{const sep=type==='p'?'\n\n':'\n';const a=el('textarea',{value:type==='a'?(o[k]||''):(o[k]||[]).join(sep),oninput:e=>{const v=e.target.value;o[k]=type==='a'?v:v.split(type==='p'?/\n\s*\n/:/\n/).map(s=>s.trim()).filter(Boolean);dirty=true}});if(type==='p')a.style.minHeight='200px';w.append(a)}
return w}
function draw(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.id==='t-'+tab));const s=S[tab],f=$('form');f.replaceChildren();
if(s.o){const c=el('div',{className:'card'});data[tab]=data[tab]||{};for(const k in s.f)c.append(field(data[tab],k,s.f[k]));f.append(c);return}
data[tab]=data[tab]||[];const arr=data[tab];
f.append(el('p',{},el('button',{textContent:'+ Add '+s.t.toLowerCase().replace(/s$/,''),onclick:()=>{const n={};for(const k in s.f)n[k]=s.f[k][0]==='c'?false:'';s.top?arr.unshift(n):arr.push(n);dirty=true;draw()}})));
arr.forEach((it,i)=>{const d=el('details',{className:'card item',open:!it[s.k]});d.append(el('summary',{},it[s.k]||'New entry'));
for(const k in s.f)d.append(field(it,k,s.f[k]));
const mv=(j)=>()=>{if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];dirty=true;draw()};
d.append(el('div',{className:'tools'},el('button',{className:'alt',textContent:'Move up',onclick:mv(i-1)}),el('button',{className:'alt',textContent:'Move down',onclick:mv(i+1)}),el('button',{className:'del',textContent:'Delete',onclick:()=>{if(confirm('Delete this entry?')){arr.splice(i,1);dirty=true;draw()}}})));f.append(d)})}
$('save').onclick=async()=>{const b=$('save');b.disabled=true;
try{for(const path in pending){let s;try{s=(await gh(path)).sha}catch{}
await gh(path,{method:'PUT',body:JSON.stringify({message:'Upload '+path,content:pending[path],branch:cfg.branch,...(s?{sha:s}:{})})});delete pending[path]}
const r=await gh('data/content.json',{method:'PUT',body:JSON.stringify({message:'Update site content',content:enc(JSON.stringify(data,null,1)+'\n'),sha,branch:cfg.branch})});
sha=r.content.sha;dirty=false;say('Saved. The live site updates in about a minute.')}catch(e){say(e.message,1)}b.disabled=false};
$('dl').onclick=()=>{const a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(data,null,1)],{type:'application/json'})),download:'content.json'});a.click()};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if(sessionStorage.cfg){cfg=JSON.parse(sessionStorage.cfg);$('repo').value=cfg.repo;$('branch').value=cfg.branch;$('token').value=cfg.token}
</script>
</body>
</html>
