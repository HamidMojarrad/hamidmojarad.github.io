<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamid Mojarad</title>
<meta name="description" content="PhD student at HHU Düsseldorf working on bias in automatic speech recognition.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfcfe;--tint:#eef2fb;--card:#fff;--ink:#172033;--soft:#5f6b7c;--line:#e1e6ef;--navy:#1d3980;--fg:#fff;--disp:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0e141d;--tint:#121b2c;--card:#151d2a;--ink:#e8edf5;--soft:#9aa7b8;--line:#243044;--navy:#8fb0ff;--fg:#0e141d}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.7 var(--sans)}
a{color:var(--navy);text-underline-offset:3px}a:focus-visible{outline:2px solid var(--navy);outline-offset:3px;border-radius:3px}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top>div{max-width:960px;margin:0 auto;padding:0 24px;height:60px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand{font:600 21px var(--disp);color:var(--ink);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none}
nav a{color:var(--soft);text-decoration:none;font-size:15px;padding:19px 0 17px;border-bottom:2px solid transparent;white-space:nowrap}
nav a:hover{color:var(--ink)}nav a.on{color:var(--ink);border-color:var(--navy)}
.hero{background:linear-gradient(180deg,var(--tint),var(--bg))}
.hero-in{max-width:960px;margin:0 auto;padding:72px 24px 56px;display:grid;grid-template-columns:1fr 280px;gap:56px;align-items:center}
.role{color:var(--soft);margin-bottom:10px}
h1{font:500 clamp(42px,6.4vw,68px)/1.02 var(--disp);letter-spacing:-.02em;margin:0 0 18px}
.tag{font:400 clamp(19px,2.3vw,24px)/1.5 var(--disp);color:var(--soft);max-width:28em;margin:0 0 28px}
.btn{display:inline-block;font:600 15px var(--sans);padding:11px 22px;border-radius:999px;border:1px solid var(--navy);color:var(--navy);text-decoration:none;margin:0 10px 10px 0}
.btn:hover{background:var(--tint)}.btn.pri{background:var(--navy);color:var(--fg)}.btn.pri:hover{opacity:.9}
.ph{position:relative;justify-self:end}
.ph:before{content:'';position:absolute;inset:14px -14px -14px 14px;border:1.5px solid var(--navy);border-radius:28px;opacity:.35}
.ph img{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;display:block;box-shadow:0 18px 44px rgba(20,40,90,.18)}
.sec{max-width:960px;margin:0 auto;padding:64px 24px 0;scroll-margin-top:60px}
h2{font:500 clamp(28px,3.6vw,36px)/1.15 var(--disp);letter-spacing:-.01em;margin:0 0 26px}
h3{font:600 20px/1.35 var(--disp);margin:0 0 4px}
p{margin:0 0 14px;max-width:46em}
.lead{font:400 21px/1.6 var(--disp)}
.row{display:grid;grid-template-columns:110px 1fr;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.row:last-child{border-bottom:1px solid var(--line)}
.k{color:var(--soft);font-size:14.5px;padding-top:2px}
.meta{color:var(--soft);font-size:14.5px;margin-bottom:8px}
.row p{margin-bottom:10px}.row p:last-child{margin:0}
.row.f{background:var(--tint);border-left:3px solid var(--navy);padding-left:20px;margin-left:-23px;grid-template-columns:107px 1fr;border-radius:0 10px 10px 0}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.card p:last-child{margin:0}
.chip{display:inline-block;font-size:13.5px;font-weight:600;padding:4px 14px;border-radius:999px;border:1px solid var(--line);text-decoration:none;margin-right:8px;background:var(--card)}
.chip:hover{border-color:var(--navy)}
.panel{background:var(--tint);border-radius:16px;padding:30px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.panel p{margin:0}.panel .btn{margin:0 0 0 10px}
.contact{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
.mail{font:500 24px var(--disp);word-break:break-all}
address{font-style:normal;margin:12px 0}
.map{width:100%;height:100%;min-height:300px;border:0;border-radius:16px}
footer{max-width:960px;margin:72px auto 0;padding:24px 24px 44px;border-top:1px solid var(--line);color:var(--soft);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--soft)}
@media(max-width:760px){.hero-in{grid-template-columns:1fr;padding-top:36px;gap:36px}.ph{order:-1;justify-self:start;width:190px}.row,.row.f{grid-template-columns:1fr;gap:2px}.row.f{margin-left:0}.contact{grid-template-columns:1fr}.panel .btn{margin:0 10px 0 0}}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;padding:0;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.burger i{display:block;width:20px;height:2px;margin:3px 0;background:currentColor;border-radius:1px}
.burger:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
@media(max-width:760px){.burger{display:flex}.top nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);padding:4px 24px 10px;overflow:visible;box-shadow:0 14px 30px rgba(20,40,90,.1)}.top nav.open{display:flex}.top nav a{padding:13px 0;border-bottom:1px solid var(--line);font-size:16px}.top nav a:last-child{border-bottom:0}.top nav a.on{border-bottom-color:var(--line);font-weight:600}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px">Loading…</p></div>
<script>
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]!==''&&a[k]!=null&&a[k]!==false)k==='class'?e.className=a[k]:e.setAttribute(k,a[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const L=(h,t,ext,cls)=>$('a',{href:h,class:cls,...(ext?{target:'_blank',rel:'noopener'}:{})},t);
const nav=[];
const sec=(id,title,...k)=>{k=k.flat().filter(Boolean);if(!k.length)return null;nav.push([id,title]);return $('section',{class:'sec',id},$('h2',{},title),...k)};
fetch('data/content.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
const p=d.profile||{},c=d.contact||{},m=(a,f)=>(a||[]).map(f),has=a=>(a||[]).length;
document.title=p.name;
const hero=$('header',{class:'hero',id:'top'},$('div',{class:'hero-in'},
$('div',{},$('div',{class:'role'},p.role),$('h1',{},p.name),p.tagline&&$('p',{class:'tag'},p.tagline)),
p.photo&&$('div',{class:'ph'},$('img',{src:p.photo,alt:p.name}))));
const body=[
sec('about','About',m(p.bio,(t,i)=>$('p',{class:i?'':'lead'},t))),
sec('research','Research',has(d.research)&&$('div',{class:'g'},m(d.research,r=>$('div',{class:'card'},$('h3',{},r.title),$('p',{},r.text))))),
sec('publications','Publications',m(d.publications,x=>$('div',{class:'row'+(x.featured?' f':'')},$('div',{class:'k'},x.year),$('div',{},$('h3',{},x.title),$('div',{class:'meta'},x.venue),x.text&&$('p',{},x.text),$('div',{},x.pdf&&L(x.pdf,'PDF',1,'chip'),x.link&&L(x.link,'Publisher page',1,'chip')))))),
sec('awards','Awards',m(d.awards,a=>$('div',{class:'row'},$('div',{class:'k'},a.date),$('div',{},$('h3',{},a.title),$('div',{class:'meta'},a.org),$('p',{},a.text))))),
sec('labs','Labs',has(d.labs)&&$('div',{class:'g'},m(d.labs,l=>$('div',{class:'card'},$('h3',{},l.url?L(l.url,l.title,1):l.title),$('p',{},l.text))))),
p.cv&&sec('cv','Curriculum Vitae',$('div',{class:'panel'},$('p',{},'My full CV as a PDF.'),$('div',{},$('a',{class:'btn pri',href:p.cv,download:''},'Download'),L(p.cv,'View online',1,'btn')))),
sec('contact','Contact',$('div',{class:'contact'},$('div',{class:'card'},c.email&&$('div',{},L('mailto:'+c.email,c.email,0,'mail')),has(c.address)&&$('address',{},...c.address.flatMap((l,i)=>i?[$('br'),l]:[l])),c.map&&$('p',{},L(c.map,'Open in Google Maps',1))),c.mapEmbed&&$('iframe',{class:'map',src:c.mapEmbed,title:'Map of my office',loading:'lazy',referrerpolicy:'no-referrer-when-downgrade',allowfullscreen:''})))
].filter(Boolean);
const nv=$('nav',{id:'menu'},nav.map(([id,t])=>$('a',{href:'#'+id,'data-id':id},t.replace('Curriculum Vitae','CV'))));
const bt=$('button',{class:'burger',type:'button','aria-label':'Menu','aria-expanded':'false','aria-controls':'menu'},$('span',{},$('i'),$('i'),$('i')));
const shut=()=>{nv.classList.remove('open');bt.setAttribute('aria-expanded','false')};
bt.onclick=()=>bt.setAttribute('aria-expanded',nv.classList.toggle('open'));
nv.onclick=e=>{if(e.target.tagName==='A')shut()};addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
const top=$('div',{class:'top'},$('div',{},L('#top',p.name,0,'brand'),nv,bt));
const foot=$('footer',{},$('span',{},'© '+new Date().getFullYear()+' '+p.name),$('span',{},(d.links||[]).flatMap((l,i)=>[i?' · ':'',L(l.url,l.label,1)])));
document.getElementById('app').replaceChildren(top,hero,$('main',{},...body),foot);
const as=[...top.querySelectorAll('nav a')],io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)as.forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id))}),{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.sec').forEach(s=>io.observe(s));
}).catch(()=>{document.getElementById('app').textContent='Could not load data/content.json. If you opened this file directly, serve it over http (e.g. python3 -m http.server).'});
</script>
</body>
</html>
