<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamid Mojarad</title>
<meta name="description" content="PhD student at HHU Düsseldorf working on bias in automatic speech recognition.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17202b;--soft:#566170;--paper:#f8fafc;--line:#dbe2ea;--navy:#1d3980;--accent:#0e8a8c;--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--ink:#e7ecf2;--soft:#9aa6b4;--paper:#10151b;--line:#27313c;--navy:#8fb0ff;--accent:#4cc9cb}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 var(--serif)}
a{color:var(--navy);text-underline-offset:3px}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:260px 1fr;gap:72px}
aside{position:sticky;top:0;align-self:start;padding:56px 0;font-family:var(--sans)}
aside img{width:132px;height:132px;object-fit:cover;border-radius:50%;display:block;margin-bottom:20px}
aside h1{font:600 28px/1.15 var(--serif);margin:0 0 6px}
aside .role{color:var(--soft);font-size:15px;line-height:1.45;margin:0 0 16px}
#wave{width:100%;height:44px;display:block;margin:0 0 18px}
#wave path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
nav{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
nav a{color:var(--soft);text-decoration:none;font-size:15px;padding:3px 0;border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
nav a:hover,nav a.on{color:var(--ink);border-color:var(--accent)}
.links{display:flex;gap:14px;font-size:14px}
main{padding:56px 0 80px;min-width:0}
section{padding-bottom:44px;scroll-margin-top:24px}
h2{font:600 24px/1.2 var(--serif);margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.tagline{font-size:23px;line-height:1.4;margin:0 0 28px;max-width:34em}
p{margin:0 0 14px;max-width:42em}
.row{display:grid;grid-template-columns:84px 1fr;gap:16px;margin-bottom:20px}
.row .k{font-family:var(--sans);font-size:14px;color:var(--soft);padding-top:3px}
.row h3{font:600 18px/1.35 var(--serif);margin:0 0 4px}
.row .meta{font-family:var(--sans);font-size:14px;color:var(--soft);margin:0 0 6px}
.row p{font-size:16px;margin-bottom:8px}
.feat{border-left:3px solid var(--accent);padding-left:14px;margin-left:-17px}
.act{font-family:var(--sans);font-size:14px;display:flex;gap:16px}
.btn{display:inline-block;font:500 15px var(--sans);padding:9px 16px;border-radius:6px;background:var(--navy);color:var(--paper);text-decoration:none;margin-right:10px}
.btn.alt{background:none;color:var(--navy);border:1px solid var(--navy)}
address{font-style:normal}
footer{font:14px var(--sans);color:var(--soft);padding:24px 0 48px;grid-column:1/-1;border-top:1px solid var(--line)}
@media(max-width:820px){.wrap{display:block}aside{position:static;padding:32px 0 0}nav{flex-direction:row;flex-wrap:wrap;gap:4px 14px}nav a{border:0;padding:0;margin:0}main{padding-top:28px}.row{grid-template-columns:1fr;gap:2px}.feat{margin-left:0}}
@media(prefers-reduced-motion:reduce){#wave path{animation:none;stroke-dashoffset:0}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<aside id="side"></aside>
<main id="main"><p>Loading…</p></main>
<footer id="foot"></footer>
</div>
<script>
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]!==''&&a[k]!=null)k==='class'?e.className=a[k]:e.setAttribute(k,a[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const A=(href,txt,ext)=>$('a',{href,...(ext?{target:'_blank',rel:'noopener'}:{})},txt);
const sections=[];
function section(id,title,...kids){if(!kids.flat().length)return;sections.push([id,title]);return $('section',{id},$('h2',{},title),...kids)}
function wave(){const n=240,pts=[];for(let i=0;i<=n;i++){const x=i/n,env=Math.sin(Math.PI*x)**1.5*(0.55+0.45*Math.sin(x*23));const y=22-20*env*(Math.sin(x*140)*.6+Math.sin(x*61+1)*.4);pts.push((x*260).toFixed(1)+' '+y.toFixed(1))}
return `<svg id="wave" viewBox="0 0 260 44" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M${pts.join('L')}"/></svg>`}
fetch('data/content.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
const p=d.profile,c=d.contact||{};document.title=p.name;
const mk=(items,fn)=>(items||[]).map(fn);
const body=[
section('about','About',p.tagline&&$('p',{class:'tagline'},p.tagline),mk(p.bio,t=>$('p',{},t))),
section('news','News',mk(d.news,n=>$('div',{class:'row'},$('div',{class:'k'},n.date),$('p',{},n.text)))),
section('research','Research',mk(d.research,r=>$('div',{},$('h3',{style:'font:600 18px var(--serif);margin:0 0 4px'},r.title),$('p',{},r.text)))),
section('publications','Publications',mk(d.publications,x=>$('div',{class:'row'},$('div',{class:'k'},x.year),$('div',{class:x.featured?'feat':''},$('h3',{},x.title),$('div',{class:'meta'},x.venue),x.text&&$('p',{},x.text),$('div',{class:'act'},x.pdf&&A(x.pdf,'PDF'),x.link&&A(x.link,'Publisher page',1)))))),
section('awards','Awards',mk(d.awards,a=>$('div',{class:'row'},$('div',{class:'k'},a.date),$('div',{},$('h3',{},a.title),$('div',{class:'meta'},a.org),$('p',{},a.text))))),
section('labs','Labs',mk(d.labs,l=>$('div',{},$('h3',{style:'font:600 18px var(--serif);margin:0 0 4px'},l.url?A(l.url,l.title,1):l.title),$('p',{},l.text)))),
p.cv&&section('cv','CV',$('a',{class:'btn',href:p.cv,download:''},'Download CV'),$('a',{class:'btn alt',href:p.cv,target:'_blank',rel:'noopener'},'Open in browser')),
section('contact','Contact',c.email&&$('p',{},A('mailto:'+c.email,c.email)),c.address&&c.address.length&&$('address',{},...c.address.flatMap((l,i)=>i?[$('br'),l]:[l])),c.map&&$('p',{style:'margin-top:10px'},A(c.map,'Open in Google Maps',1)))
];
document.getElementById('main').replaceChildren(...body.filter(Boolean));
const side=document.getElementById('side');
side.innerHTML=(p.photo?`<img src="${p.photo}" alt="">`:'')+wave();
const h=$('h1',{},p.name),r=$('p',{class:'role'},p.role);
side.insertBefore(r,side.querySelector('#wave'));side.insertBefore(h,r);
side.append($('nav',{},sections.map(([id,t])=>$('a',{href:'#'+id,'data-id':id},t))),$('div',{class:'links'},mk(d.links,l=>A(l.url,l.label,1))));
document.getElementById('foot').textContent='© '+new Date().getFullYear()+' '+p.name;
const links=[...document.querySelectorAll('nav a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id))}),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('main section').forEach(s=>io.observe(s));
}).catch(e=>{document.getElementById('main').textContent='Could not load data/content.json. If you opened this file directly, serve it over http (e.g. python3 -m http.server).'});
</script>
</body>
</html>
