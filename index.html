<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hamid Mojarad</title>
<meta name="description" content="PhD student at HHU Düsseldorf working on bias in automatic speech recognition.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#121a26;--soft:#5b6676;--line:#dde3ec;--link:#1d3980;--teal:#0e8a8c;--amber:#f2b45c;--disp:'Fraunces',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0c121b;--card:#141c28;--ink:#e8edf4;--soft:#97a3b3;--line:#232d3b;--link:#9db8ff}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.7 var(--sans)}
a{color:var(--link);text-underline-offset:3px}a:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.top{position:fixed;inset:0 0 auto;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:0 24px;height:56px;background:rgba(10,19,48,.45);backdrop-filter:blur(12px);transition:background .3s}
.top.s{background:rgba(10,19,48,.92)}
.top .brand{font:700 18px var(--disp);color:#fff;text-decoration:none;white-space:nowrap}
.top nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.top nav a{color:#c4cfe8;text-decoration:none;font-size:14.5px;padding:6px 11px;border-radius:999px;white-space:nowrap}
.top nav a:hover{color:#fff}.top nav a.on{background:rgba(255,255,255,.14);color:#fff}
.hero{position:relative;min-height:94vh;display:flex;align-items:center;background:#0a1330;color:#fff;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,19,48,.94) 0,rgba(10,19,48,.6) 55%,rgba(10,19,48,.1) 100%),linear-gradient(0deg,var(--bg) 0,transparent 16%)}
.hero-in{position:relative;z-index:2;width:100%;max-width:1120px;margin:0 auto;padding:110px 24px 90px;display:grid;grid-template-columns:1.5fr .8fr;gap:48px;align-items:center}
.hero-in>*>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-in>*>*:nth-child(2){animation-delay:.12s}.hero-in>*>*:nth-child(3){animation-delay:.24s}.hero-in>*>*:nth-child(4){animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}}
.role{color:#aebcdf;font-size:18px;margin-bottom:14px}
h1{font:700 clamp(46px,8.4vw,98px)/.96 var(--disp);letter-spacing:-.025em;margin:0 0 22px}
.tag{font:italic 400 clamp(20px,2.5vw,29px)/1.4 var(--disp);max-width:27em;margin:0 0 32px;color:#e9eefb}
.btn{display:inline-block;font:600 15px var(--sans);padding:12px 22px;border-radius:999px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;margin:0 10px 10px 0;transition:background .2s}
.btn:hover{background:rgba(255,255,255,.12)}.btn.pri{background:var(--amber);border-color:var(--amber);color:#1a1405}.btn.pri:hover{background:#ffc878}
.ph{justify-self:center;width:min(310px,80%);aspect-ratio:4/5;border-radius:999px 999px 28px 28px;overflow:hidden;border:1px solid rgba(255,255,255,.3);box-shadow:0 0 0 10px rgba(255,255,255,.06),0 34px 80px rgba(0,0,0,.5)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.sec{max-width:1120px;margin:0 auto;padding:76px 24px 0;scroll-margin-top:40px}
h2{font:700 clamp(30px,4.4vw,44px)/1.1 var(--disp);letter-spacing:-.015em;margin:0 0 34px}
h2:after{content:'';display:block;width:64px;height:4px;margin-top:14px;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--amber))}
h3{font:700 21px/1.3 var(--disp);margin:0 0 6px}
p{margin:0 0 14px;max-width:46em}
.lead{font:400 clamp(21px,2.4vw,26px)/1.5 var(--disp)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px;position:relative;overflow:hidden}
.card:before{content:'';position:absolute;inset:0 0 auto;height:4px;background:var(--teal)}.g>.card:nth-child(even):before{background:var(--amber)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card p:last-child{margin:0}
.tl{border-left:2px solid var(--line);margin-left:7px}
.it{position:relative;padding:0 0 22px 28px}.it:before{content:'';position:absolute;left:-8px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--teal)}
.it b{font-size:14px;color:var(--teal)}.it p{margin:2px 0 0}
.pubs{display:grid;gap:18px}
.pub{display:grid;grid-template-columns:78px 1fr;gap:18px}
.pub .y{font:700 30px/1.1 var(--disp);color:var(--teal)}
.venue{color:var(--soft);font-size:14.5px;margin-bottom:10px}
.pub.f{background:linear-gradient(135deg,#14275e,#0a1330 70%);color:#fff;border:0;padding:34px}
.pub.f:before{background:linear-gradient(90deg,var(--teal),var(--amber))}.pub.f .y{color:var(--amber)}.pub.f .venue{color:#aebcdf}.pub.f h3{font-size:26px}
.chip{display:inline-block;font-size:13.5px;font-weight:600;padding:6px 15px;border-radius:999px;border:1px solid currentColor;text-decoration:none;margin-right:8px;color:var(--link)}
.f .chip{color:#fff}.chip:hover{background:rgba(127,127,127,.15)}
.date{display:inline-block;font-size:13px;font-weight:600;color:#7a5200;background:#fbe7c4;border-radius:999px;padding:2px 12px;margin-bottom:12px}
@media(prefers-color-scheme:dark){.date{background:#3a2c10;color:var(--amber)}}
.band{background:linear-gradient(120deg,#14275e,var(--teal));color:#fff;border-radius:22px;padding:42px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px}
.band h2{margin:0;font-size:clamp(26px,3.4vw,36px)}.band h2:after{display:none}.band .btn{margin:0 0 0 10px}
.mail{font:700 clamp(22px,3vw,32px) var(--disp);word-break:break-all}
address{font-style:normal;margin:12px 0}
footer{max-width:1120px;margin:80px auto 0;padding:26px 24px 48px;border-top:1px solid var(--line);color:var(--soft);font-size:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
footer a{color:var(--soft)}
@media(max-width:820px){.hero-in{grid-template-columns:1fr;padding-top:96px}.ph{order:-1;width:170px}.top .brand{display:none}.pub{grid-template-columns:1fr;gap:4px}.band{padding:28px}.band .btn{margin:0 10px 0 0}}
@media(prefers-reduced-motion:reduce){.hero-in>*>*{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="app"><p style="padding:40px">Loading…</p></div>
<script>
const $=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]!==''&&a[k]!=null&&a[k]!==false)k==='class'?e.className=a[k]:e.setAttribute(k,a[k])}e.append(...c.flat().filter(x=>x!=null&&x!==false));return e};
const L=(h,t,ext,cls)=>$('a',{href:h,class:cls,...(ext?{target:'_blank',rel:'noopener'}:{})},t);
const nav=[];
const sec=(id,title,...k)=>{k=k.flat().filter(Boolean);if(!k.length)return null;nav.push([id,title]);return $('section',{class:'sec',id},$('h2',{},title),...k)};
function spectro(cv){const W=200,H=70,x=cv.getContext('2d'),im=x.createImageData(W,H),D=im.data;cv.width=W;cv.height=H;
const pal=v=>{v=Math.min(1,Math.max(0,v));if(v<.5){const k=v*2;return[10+4*k,19+119*k,48+92*k]}const k=(v-.5)*2;return[14+228*k,138+42*k,140-48*k]};
const g=(y,m,w)=>Math.exp(-(((y-m)/w)**2));
const frame=t=>{for(let i=0;i<W;i++){const tt=i*.05+t,e=Math.max(0,Math.sin(tt*1.3)*Math.sin(tt*.47+1)+.18),f1=.2+.06*Math.sin(tt*.9),f2=.45+.08*Math.sin(tt*.55+2),f3=.72+.04*Math.sin(tt*1.4);
for(let j=0;j<H;j++){const y=1-j/H;let v=1.35*e*(g(y,f1,.05)+.8*g(y,f2,.05)+.5*g(y,f3,.04))*(.62+.38*Math.sin(y*H*2.2+tt*3))+((i*127+j*311)%97)/97*.07;const c=pal(v),o=(j*W+i)*4;D[o]=c[0];D[o+1]=c[1];D[o+2]=c[2];D[o+3]=255}}x.putImageData(im,0,0)};
frame(0);if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
let last=0;const loop=n=>{if(n-last>40&&scrollY<innerHeight){last=n;frame(n/2200)}requestAnimationFrame(loop)};requestAnimationFrame(loop)}
fetch('data/content.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{
const p=d.profile||{},c=d.contact||{},m=(a,f)=>(a||[]).map(f),has=a=>(a||[]).length;
document.title=p.name;const cv=$('canvas');
const hero=$('header',{class:'hero',id:'top'},cv,$('div',{class:'hero-in'},
$('div',{},$('div',{class:'role'},p.role),$('h1',{},p.name),p.tagline&&$('p',{class:'tag'},p.tagline),
$('div',{},p.cv&&$('a',{class:'btn pri',href:p.cv,download:''},'Download CV'),has(d.publications)&&L('#publications','Publications',0,'btn'),c.email&&L('mailto:'+c.email,'Email me',0,'btn'))),
p.photo&&$('div',{},$('div',{class:'ph'},$('img',{src:p.photo,alt:p.name})))));
const body=[
sec('about','About',m(p.bio,(t,i)=>$('p',{class:i?'':'lead'},t))),
sec('news','News',has(d.news)&&$('div',{class:'tl'},m(d.news,n=>$('div',{class:'it'},$('b',{},n.date),$('p',{},n.text))))),
sec('research','Research',has(d.research)&&$('div',{class:'g'},m(d.research,r=>$('div',{class:'card'},$('h3',{},r.title),$('p',{},r.text))))),
sec('publications','Publications',has(d.publications)&&$('div',{class:'pubs'},m(d.publications,x=>$('div',{class:'card pub'+(x.featured?' f':'')},$('div',{class:'y'},x.year),$('div',{},$('h3',{},x.title),$('div',{class:'venue'},x.venue),x.text&&$('p',{},x.text),$('div',{},x.pdf&&L(x.pdf,'PDF',1,'chip'),x.link&&L(x.link,'Publisher page',1,'chip'))))))),
sec('awards','Awards',has(d.awards)&&$('div',{class:'g'},m(d.awards,a=>$('div',{class:'card'},$('span',{class:'date'},a.date),$('h3',{},a.title),$('div',{class:'venue'},a.org),$('p',{},a.text))))),
sec('labs','Labs',has(d.labs)&&$('div',{class:'g'},m(d.labs,l=>$('div',{class:'card'},$('h3',{},l.url?L(l.url,l.title,1):l.title),$('p',{},l.text))))),
p.cv&&sec('cv','CV',$('div',{class:'band'},$('h2',{},'Curriculum Vitae'),$('div',{},$('a',{class:'btn pri',href:p.cv,download:''},'Download PDF'),L(p.cv,'View online',1,'btn')))),
sec('contact','Contact',$('div',{class:'card'},c.email&&$('div',{},L('mailto:'+c.email,c.email,0,'mail')),has(c.address)&&$('address',{},...c.address.flatMap((l,i)=>i?[$('br'),l]:[l])),c.map&&$('p',{},L(c.map,'Open in Google Maps',1))))
].filter(Boolean);
const top=$('div',{class:'top'},L('#top',p.name,0,'brand'),$('nav',{},nav.map(([id,t])=>$('a',{href:'#'+id,'data-id':id},t))));
const foot=$('footer',{},$('span',{},'© '+new Date().getFullYear()+' '+p.name),$('span',{},m(d.links,(l,i)=>[i?' · ':'',L(l.url,l.label,1)])));
document.getElementById('app').replaceChildren(top,hero,$('main',{},...body),foot);
spectro(cv);
addEventListener('scroll',()=>top.classList.toggle('s',scrollY>40),{passive:true});
const as=[...top.querySelectorAll('nav a')],io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)as.forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id))}),{rootMargin:'-30% 0px -60% 0px'});
document.querySelectorAll('.sec').forEach(s=>io.observe(s));
}).catch(()=>{document.getElementById('app').textContent='Could not load data/content.json. If you opened this file directly, serve it over http (e.g. python3 -m http.server).'});
</script>
</body>
</html>
